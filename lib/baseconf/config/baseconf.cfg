# Project-local target configuration. Keep ZCCCFG pointed at the stock z88dk
# config directory; select this file with +/absolute/path/baseconf.cfg.
#
# zcc parses this file one line at a time and ignores every line that does not
# start with an uppercase letter, so backslash continuations are not supported:
# each directive has to fit on a single line.
# Set BASECONF_ROOT to the absolute lib/baseconf directory when invoking zcc
# directly; project Makefiles export it automatically.
INCLUDE tools.inc
APPMAKEEXE ${BASECONF_ROOT}/../../tools/appmake/build/z88dk-appmake

CRT0     ${BASECONF_ROOT}/config/baseconf_crt0
OPTIONS  -O2 -SO2 -subtype=none -D__BASECONF -D__Z80 -D__Z80__ -pragma-define:CONSOLE_COLUMNS=32 -pragma-define:CONSOLE_ROWS=24

# zcc's -compiler=sdcc and -clib=classic select this ABI/libc pair.
# baseconf.lib is built from this repository by lib/baseconf/Makefile; the
# generic z80 classic library follows it so that baseconf keeps the first
# definition of the console hooks it provides.
CLIB     classic -Cc-standard-escape-chars -lbaseconf -lzx_clib -lmzx -lmath48 -lz80_clib -lndos -IDESTDIR/include -LDESTDIR/lib/clibs/z80

# zcc resolves -subtype against this list with isspace() after the subtype name,
# so an empty option list still needs the trailing space to stay matchable.
SUBTYPE  none 
INCLUDE alias.inc
